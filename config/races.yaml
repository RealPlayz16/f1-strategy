# Dry-race candidates, 2023-2025 regulation era.
# Wet races (INTERMEDIATE/WET compounds present) are auto-excluded by ingest.py.
#
# Session 8 split. The 13 new dry 2025 races were split by ROUND PARITY, which is
# independent of the outcome being validated: picking holdout races by their SC/VSC count
# would select on the dependent variable and inflate the apparent neutralisation rate.
# Odd round -> train, even round -> holdout, EXCEPT Fast Flag training races, which are
# forced to train by the rule that moved 2025 Dutch in Session 1.
# Fast Flag check races stay parity-eligible; see the conditional rule in HANDOFF.md.
# Result: train 30, holdout 9 with 6 SC/VSC deployments (2025 Miami excluded, see below).
